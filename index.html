<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aniimo 日課チェックリスト</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
    <link href="https://fonts.googleapis.com/css2?family=Yusei+Magic&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="AniimoDailyToDoList.css">
</head>
<body>
    <div class="container">

        <h1>Aniimo 日課チェックリスト</h1>
        <h2> 毎日の日課</h2>
        <p id="progress">達成数：0 / 7</p>

        <div class="progress-track" id="progress-track"></div>

        <div class="task-card">
            <label>
                <input type="checkbox">
                デイリー活躍（500ポイント）
            </label>
        </div>

        <div class="task-card">
            <label>
                <input type="checkbox">
                スタミナを消費する
            </label>
        </div>

        <div class="task-card">
            <label>
                <input type="checkbox">
                ホームキャンプのデイリー注文
            </label>
        </div>

        <div class="task-card">
            <label>
                <input type="checkbox">
                フレンドに2回メッセージを送る
            </label>
        </div>

        <div class="task-card">
            <label>
                <input type="checkbox">
                謎の商人から商品を購入する
            </label>
        </div>

        <div class="task-card">
            <label>
                <input type="checkbox">
                綺羅星のお茶会（18:00〜翌2:00）
            </label>
        </div>

        <div class="task-card">
            <label>
                <input type="checkbox">
                ゲーム内メールを確認する
            </label>
        </div>

    </div>

    <script src="AniimoDailyToDoList.js"></script>
</body>
</html>
